services:
  - type: web
    name: saas-churn-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirement.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
